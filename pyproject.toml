[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legorec"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6",
    "pillow>=10.1",  # ImageFont.load_default(size=...)
]

[project.optional-dependencies]
# torch: install the CUDA build from pytorch.org FIRST (PyPI gives CPU-only on Windows)
train = ["torch>=2.4", "torchvision", "wandb"]
detect = ["ultralytics>=8.3"]  # YOLO-seg: finds the bricks (AGPL-3.0)
docs = ["matplotlib>=3.6", "reportlab"]  # scripts/class_overview*.py
dev = ["pytest", "ruff>=0.17,<0.18", "nbstripout", "pre-commit", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]
