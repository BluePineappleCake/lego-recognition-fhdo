# Contrast stretch, trained on renders + the internet photos (train split).
# Every real photo is used real_repeat times per epoch (augmented anew each
# time), so they make up about a third of the training images.
# Compare with configs/shape_contrast.yaml on internet_val/* in W&B and on our
# own photos. Model selection stays on the render val set.
size: 96
width: 32
size_feature: false
contrast: stretch
train_on: [kaggle_renders, internet_photos]
classes_from: [kaggle_renders]  # the 50 render parts, as before
real_repeat: 8
epochs: 30
tags: [renders+internet, contrast]
